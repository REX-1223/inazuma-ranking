<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>イナズマイレブン 動画ランキング</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
:root{
  --bg:#eef0f6; --card:#ffffff; --ink:#151a2d; --muted:#667090; --line:#d8dcea;
  --hero1:#1b2a6b; --hero2:#3a1d78; --accent:#ff4f6d; --gold:#e8a700; --silver:#8d95a8; --bronze:#b86a35;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c0f1c; --card:#161b30; --ink:#eef0fa; --muted:#98a1c4; --line:#262d4c;
    --hero1:#101a52; --hero2:#2a1260; --accent:#ff6b86; --gold:#ffc93c; --silver:#b6bdd0; --bronze:#e08a52;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c0f1c; --card:#161b30; --ink:#eef0fa; --muted:#98a1c4; --line:#262d4c;
  --hero1:#101a52; --hero2:#2a1260; --accent:#ff6b86; --gold:#ffc93c; --silver:#b6bdd0; --bronze:#e08a52;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.5}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;padding:2rem 1.25rem 3.5rem}
.hero div{max-width:40rem;margin:0 auto}
.tag{display:inline-block;background:var(--accent);color:#fff;font-weight:900;font-size:.75rem;padding:.2rem .6rem;border-radius:99px;margin-bottom:.6rem}
h1{margin:0;font-size:clamp(1.8rem,8vw,2.6rem);font-weight:900;line-height:1.2}
.sub{margin:.5rem 0 0;opacity:.8;font-size:.85rem}
main{position:relative;max-width:40rem;margin:-2rem auto 0;padding:0 1rem 3rem}
.tabs{display:flex;gap:.4rem;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:.3rem;margin-bottom:1rem}
.tabs button{flex:1;font:inherit;font-weight:900;font-size:.95rem;color:var(--muted);background:none;border:0;border-radius:99px;padding:.6rem 0;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--accent);color:#fff}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.7rem}
.item{display:grid;grid-template-columns:2.6rem 1fr;gap:.6rem;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:.9rem;padding:.7rem .8rem .7rem .5rem;text-decoration:none;color:inherit}
.rank{font-size:1.9rem;font-weight:900;text-align:center;color:var(--muted);line-height:1}
.r1 .rank{color:var(--gold);font-size:2.4rem}.r2 .rank{color:var(--silver);font-size:2.1rem}.r3 .rank{color:var(--bronze);font-size:2.1rem}
.r1{border:2px solid var(--gold);background:linear-gradient(135deg,var(--card),rgba(255,201,60,.25));animation:pop .5s backwards,glow 1.8s ease-in-out .5s infinite}
.r1 .t{font-size:1.02rem}.r1 .views{font-size:1.3rem}.r1 .rank{text-shadow:0 0 12px rgba(255,201,60,.8)}
.body{display:grid;grid-template-columns:7.2rem 1fr;gap:.7rem;align-items:center;min-width:0}
.thumb{aspect-ratio:16/9;border-radius:.5rem;position:relative;overflow:hidden;background:linear-gradient(135deg,#3a4a9a,#1b2255)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb span{position:absolute;right:.25rem;bottom:.25rem;background:rgba(0,0,0,.75);color:#fff;font-size:.65rem;font-weight:700;padding:0 .3rem;border-radius:.2rem}
.t{font-weight:700;font-size:.9rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.m{margin-top:.25rem;font-size:.75rem;color:var(--muted)}
.views{color:var(--accent);font-weight:900;font-size:.95rem}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 .5rem rgba(255,190,0,.45)}50%{box-shadow:0 0 1.6rem 4px rgba(255,190,0,.95)}}
.item{animation:pop .5s backwards;transition:transform .15s}
.item:hover{transform:translateY(-2px) scale(1.01)}
li:nth-child(2) .item{animation-delay:.07s}li:nth-child(3) .item{animation-delay:.14s}li:nth-child(4) .item{animation-delay:.21s}li:nth-child(5) .item{animation-delay:.28s}li:nth-child(6) .item{animation-delay:.35s}li:nth-child(n+7) .item{animation-delay:.42s}
.badge{display:inline-block;font-size:.7rem;font-weight:900;padding:.05rem .55rem;border-radius:99px;margin:0 .3rem .25rem 0;color:#fff}
.b1{background:linear-gradient(90deg,#ffd23c,#ff9d00);color:#3a2a00}.b2{background:linear-gradient(90deg,#d5dae6,#9ba3b8);color:#1c2233}.b3{background:linear-gradient(90deg,#e59a63,#b8622a)}.bn{background:#14b86a}
@media (prefers-reduced-motion:reduce){.item,.r1{animation:none}}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:.9rem;padding:2rem 1rem;text-align:center;color:var(--muted)}
.note{margin-top:1.5rem;font-size:.75rem;color:var(--muted);text-align:center}
</style>
</head>
<body>
<header class="hero"><div>
  <span class="tag">毎日更新</span>
  <h1>イナズマイレブン<br>動画ランキング</h1>
  <p class="sub" id="date">読み込み中…</p>
</div></header>
<main>
  <div class="tabs" role="group" aria-label="期間">
    <button data-k="d" aria-pressed="true">今日</button>
    <button data-k="w" aria-pressed="false">今週</button>
    <button data-k="m" aria-pressed="false">今月</button>
  </div>
  <ol id="list"></ol>
  <p class="note" id="note"></p>
</main>
<script>
(function(){
  var data=null, cur='d';
  var list=document.getElementById('list');
  function fmt(n){ return n>=10000 ? (n/10000).toFixed(1).replace(/\.0$/,'')+'万' : n.toLocaleString('ja-JP'); }
  function el(tag,cls,text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e; }
  function badges(i,v){
    var box=document.createDocumentFragment();
    if(i===0) box.appendChild(el('span','badge b1','👑 NO.1'));
    else if(i===1) box.appendChild(el('span','badge b2','NO.2'));
    else if(i===2) box.appendChild(el('span','badge b3','NO.3'));
    if(Date.now()-new Date(v.published).getTime() < 6*3600*1000) box.appendChild(el('span','badge bn','NEW'));
    return box;
  }
  function render(){
    list.textContent='';
    var items=(data.windows&&data.windows[cur])||[];
    if(!items.length){
      var li=el('li'); li.appendChild(el('div','empty','条件に合う動画はまだありません（'+fmt(data.threshold)+'回再生以上）'));
      list.appendChild(li); return;
    }
    items.forEach(function(v,i){
      var li=el('li');
      var a=el('a','item r'+(i+1)); a.href='https://www.youtube.com/watch?v='+encodeURIComponent(v.id); a.target='_blank'; a.rel='noopener';
      a.appendChild(el('div','rank',String(i+1)));
      var body=el('div','body');
      var th=el('div','thumb');
      if(v.thumb){ var img=el('img'); img.src=v.thumb; img.alt=''; img.loading='lazy'; th.appendChild(img); }
      th.appendChild(el('span','',v.duration||''));
      body.appendChild(th);
      var info=el('div');
      info.appendChild(badges(i,v));
      info.appendChild(el('div','t',v.title));
      info.appendChild(el('div','m',v.channel));
      var m=el('div','m'); m.appendChild(el('span','views',(i<3?'🔥 ':'')+fmt(v.views)+' 回再生'));
      info.appendChild(m);
      body.appendChild(info);
      a.appendChild(body); li.appendChild(a); list.appendChild(li);
    });
  }
  var btns=document.querySelectorAll('.tabs button');
  Array.prototype.forEach.call(btns,function(b){
    b.addEventListener('click',function(){
      cur=b.getAttribute('data-k');
      Array.prototype.forEach.call(btns,function(x){ x.setAttribute('aria-pressed',x===b?'true':'false'); });
      if(data) render();
    });
  });
  fetch('data.json?'+Date.now()).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }).then(function(j){
    data=j;
    var d=new Date(j.updated);
    document.getElementById('date').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+' 更新';
    document.getElementById('note').textContent='投稿から対象期間内で、'+fmt(j.threshold)+'回再生以上の動画を再生数順に表示しています。';
    render();
  }).catch(function(){
    document.getElementById('date').textContent='データを読み込めませんでした';
  });
})();
</script>
</body>
</html>
