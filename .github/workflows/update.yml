name: 毎日更新

on:
  schedule:
    - cron: "17 21 * * *"   # 日本時間 6:17ごろ
    - cron: "17 3 * * *"    # 日本時間 12:17ごろ
    - cron: "17 11 * * *"   # 日本時間 20:17ごろ
  workflow_dispatch:        # 手動で今すぐ動かすボタン

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: 動画を集める
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 fetch_videos.py
      - name: サイトのファイルをまとめる
        run: |
          mkdir site
          cp index.html data.json site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
